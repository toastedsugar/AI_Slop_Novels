- id: greenwood
  name: The Greenwood
  type: forest
  aliases: [the forest, the woods]
  scale: regional
  parent_location: null
  domain: fae
  on_page: true
  description: An ancient old-growth cedar forest in the Cascade range, tended by fae and centered on the Mother tree. Its edges are contested by human logging interests.
  sensory_palette:
    sight: towering red cedars, shafts of gold through canopy, deep moss, mist in the low places
    sound: wind moving through high branches, crow calls, the distant ring of axes at the edges
    smell: cedar resin, wet moss, autumn leaf-rot
    touch: cool air, damp moss underfoot, rough furrowed bark
  tone: reverent, watchful, alive
  narrative_role: primary setting and the being under threat

- id: heart_tree_clearing
  name: The Heart Tree Clearing
  type: clearing
  aliases: [the Mother's clearing, the eastern ridge, the priority fell site]
  scale: local
  parent_location: greenwood
  domain: fae
  on_page: true
  description: A wide, moss-floored clearing deep in the eastern Greenwood, ringed by old-growth cedars and dominated by the Mother — a thousand-year red cedar nine feet across and roughly 250 feet tall. On Miller Company maps, this is marked EASTERN RIDGE / HEART CEDAR.
  sensory_palette:
    sight: the Mother's massive buttressed trunk, a rain basin at her roots, hollows where offerings collect, green-gold light
    sound: near-silence, broken by crow calls and the creak of old wood
    smell: sweet cedar sap, cold earth, fungus
    touch: cool bark, thick wet moss, packed needles
  tone: sacred, charged, ancient
  narrative_role: story's sacred heart; site of the inciting reverence, the black moment, and the named sacrifice

- id: greenwood_eastern_edge
  name: The Eastern Edge
  type: boundary
  aliases: [the tree line, the trailhead]
  scale: local
  parent_location: greenwood
  domain: liminal
  on_page: true
  description: The frayed boundary where the Greenwood gives way to logged slash, skid trails, and the approaches to Miller's Cut. A place of stumps, fresh cuts, and stakes with red ribbons.
  sensory_palette:
    sight: standing timber on one side, stumps and slash on the other, surveyor stakes, lanterns at night
    sound: axes and saws by day, silence and owl-call at night
    smell: fresh-cut sapwood, pitch, smoke from the camp
    touch: sawdust, splintered wood, trampled fern
  tone: transitional, fraught, unsafe
  narrative_role: where human and fae worlds collide; site of Cal's rescue and repeated crossings

- id: cals_cabin
  name: Cal's Cabin
  type: dwelling
  aliases: [the cabin]
  scale: local
  parent_location: null
  domain: human
  on_page: true
  description: A one-room logger's cabin built by Cal's father, roughly half a mile from Miller's Cut. Single stove, bed, table, one chair, a shelf of whittled birds, Bract's rag rug. A second room is added in the epilogue.
  sensory_palette:
    sight: lantern light, stove-glow, whittled wooden birds on a shelf, a hat on a peg
    sound: the kettle, wood popping in the stove, Bract's tail on floorboards, wind at the eaves
    smell: cedar smoke, stew, coffee, wet dog, pine pitch
    touch: rough-hewn floor, the smooth worn chair, the cold iron latch
  tone: spare, tender, private
  narrative_role: domestic heart of the romance; the warm room where the courtship unfolds

- id: hidden_spring
  name: The Hidden Spring
  type: water_feature
  aliases: [the spring]
  scale: local
  parent_location: greenwood
  domain: fae
  on_page: true
  description: A small spring in a mossy hollow, not as sacred as the Mother but imbued with restorative power. Gold light filters down through cedars onto its surface.
  sensory_palette:
    sight: clear water over pale stones, moss-draped rocks, shafts of light
    sound: a low continuous trickle, bird calls
    smell: cold water, wet stone, green growth
    touch: icy water, slick moss, smooth pebbles
  tone: quiet, healing, intimate
  narrative_role: site of the first shared secret and later the aftermath of the sacrifice

- id: millers_cut
  name: Miller's Cut
  type: logging_camp
  aliases: [the camp]
  scale: local
  parent_location: null
  domain: human
  on_page: true
  description: An active Miller Company logging camp at the Greenwood's eastern edge, composed of bunkhouses, a cookhouse, skid roads, and ox teams. Crew of perhaps twenty, under foreman Hiram Beck.
  sensory_palette:
    sight: bunkhouse rows, stacked logs, mud and churned earth, lantern smoke
    sound: axes, two-man saws, men shouting, oxen
    smell: fresh-cut sapwood, grease, pipe tobacco, unwashed wool
    touch: splintered wood, cold iron tools, rough canvas
  tone: coarse, laborious, hostile to the uncanny
  narrative_role: Cal's workplace and the engine of the external threat

- id: hollow_creek
  name: Hollow Creek
  type: town
  aliases: [town, the valley]
  scale: settlement
  parent_location: null
  domain: human
  on_page: true
  description: The nearest town down the mountain from Miller's Cut — a single main street with a Miller Company office, post office, blacksmith, and a handful of shops. Population of hundreds, not thousands.
  sensory_palette:
    sight: board sidewalks, hitching posts, painted signs, woodsmoke rising from chimneys
    sound: cart wheels on gravel, the blacksmith's hammer, a bell over a door
    smell: horses, bread, coal smoke, damp wool
    touch: worn wood, cold door handles, muddy boards
  tone: ordinary, lived-in, indifferent
  narrative_role: the human-world hinge where debts are paid and letters are delivered

- id: miller_company_office
  name: Miller Company Office
  type: building
  aliases: [the company office]
  scale: local
  parent_location: hollow_creek
  domain: human
  on_page: true
  description: A single-room company office with a counter, a ledger, and a locked cashbox. Contracts are issued and debts recorded here.
  sensory_palette:
    sight: ledgers, a brass bell, maps of timber claims on the wall, a stamp pad with red ink
    sound: a scratching pen, the clink of coin, the clerk's flat voice
    smell: ink, paper, coal smoke
    touch: the polished counter, heavy ledger pages
  tone: transactional, cold
  narrative_role: where Cal turns himself in and where the material debt is discharged

- id: hollow_creek_post_office
  name: Hollow Creek Post Office
  type: building
  aliases: [the post office]
  scale: local
  parent_location: hollow_creek
  domain: human
  on_page: true
  description: A small post office run by Mae Pritchard, with a counter, wall of pigeonhole boxes, and a scale.
  sensory_palette:
    sight: pigeonholes stuffed with paper, a brass scale, a handkerchief, stamps under glass
    sound: the stamp thunking, paper rustling
    smell: paper, glue, wood polish
    touch: the worn counter, a folded letter
  tone: quiet, unexpectedly kind
  narrative_role: where Samuel's letter arrives and the private debt dissolves

- id: portland
  name: Portland
  type: city
  aliases: [the city]
  scale: regional
  parent_location: null
  domain: human
  on_page: false
  description: A regional city to the west. Samuel's teaching apprenticeship and room-and-board are here; Cal's conservation society contact runs through Samuel's network here.
  sensory_palette:
    sight: unseen on the page
    sound: unseen on the page
    smell: unseen on the page
    touch: unseen on the page
  tone: distant, hopeful
  narrative_role: off-page resolution anchor — the destination that makes Cal's sacrifice survivable
