chapter:
  id: ch01
  number: 1
  title: "The Mother's Voice"
  word_count_target: 800

  narrative_function: establish_protagonist_and_world
  arc_position: opening
  story_structure_role: >
    Introduces Thistle in her unbreached world and plants the rupture
    (distant cry) that propels her toward Cal's story.

  pov:
    mode: single
    character: thistle

  setting_summary:
    time_of_year: autumn_1897
    time_of_day: golden_hour

  locations_present:
    - heart_tree_clearing

  locations_referenced:
    - greenwood_eastern_edge
    - millers_cut

  characters_present:
    - thistle
    - morrow           # arrives mid-chapter, crow then half-form
    - the_mother       # non-speaking presence

  characters_referenced:
    - cal              # the distant cry; unnamed in this chapter
    - thomas           # Morrow's lost mate
    - miller_men       # off-page threat

  objects_present:
    - brass_button
    - child_bootlace
    - tin_whistle
    - rain_basin

  objects_referenced:
    - miller_stakes

  emotional_register: reverent_then_unsettled

  themes_active:
    - custodianship
    - the_pull_of_human_things
    - warning_delivered_and_overridden

  voices_introduced:
    - thistle_formal_cadence      # dominant register
    - thistle_steel_voice         # first appearance, single line at threat-to-Mother

  plants_for_later:
    tin_whistle: ch10_samuels_whistle
    morrow_thomas_reference: ch09_morrows_blessing
    formal_cadence: recurring_through_ch09
    steel_voice: recurring_at_threats_to_mother

  continuity_out:
    thistle_state: "Moving east on foot toward an unknown human cry. Tin whistle left on the Mother's roots."
    location_end: "Greenwood interior, moving toward the eastern edge."
    unresolved: "Morrow's warning accepted intellectually, overridden in practice."

  beats:
    - id: ch01_b01
      title: "Report to the Mother"
      approx_words: 300
      opens_on: >
        Thistle already at the heart tree, palm flat against the Mother's
        bark. No arrival shown — the reader meets her mid-ritual, as though
        this is something she has done ten thousand times.
      action_sequence:
        - "Thistle reports the day's tending in her formal cadence: a vixen's den reinforced at the west seep, a blight of rot on the north slope turned back with hand and song. She names each thing precisely. The Mother does not answer in words, but the bark warms under her palm, and she inclines her head as though having been answered."
        - "She walks three slow steps to the rain basin at the clearing's edge — a shallow stone hollow, glass-still. She kneels to drink. Her reflection is the vehicle for her appearance: freckles in the scatter-pattern of birch bark, eyes the precise green of sun filtered through young leaves, ash-blonde hair loose past her shoulders. She is human-sized in glamour. The wings are not shown — only the absence of them is felt, a held breath."
        - "She returns to the Mother's base and crouches at a hollow between two buttress roots. From it she draws her collection one piece at a time: a brass button (green with age), a child's bootlace still knotted at one end, a tin whistle dulled by weather. She turns each over in her palm. She sets them back carefully, in order. The narrative interior makes clear she has taken these from the forest's edge over years — that humans leave things, and she cannot help gathering them, and she does not fully understand why."
      beat_function: >
        Establish Thistle's role (custodian), her register (formal, reverent),
        her appearance (via basin-reflection, not narrator description), and
        the crack in her otherwise-complete world (the hollow of human things).
      prose_directives:
        - "Open in medias res. No 'once upon a time' framing."
        - "The formal cadence must be present from her first spoken line — she does not warm into it."
        - "The collection is described tenderly, not comically. It is the chapter's first foreshadow."
      closes_on: >
        The tin whistle set back in the hollow last, her fingers lingering
        on it a half-second longer than the others.

    - id: ch01_b02
      title: "Morrow's Warning"
      approx_words: 250
      opens_on: >
        A shadow passes over the clearing. A crow drops onto a low cedar
        branch with a weight that is wrong for a bird — heavier, more
        deliberate. Thistle does not startle. She knows the landing.
      action_sequence:
        - "The crow shifts. Not fully — Morrow never goes fully human in Thistle's presence, a deliberate austerity. Her half-form resolves: a woman's face, a woman's throat, but crow's black-bead eyes and feathered shoulders that ruffle when she is agitated. She is agitated now."
        - "Morrow delivers warning #1 in the exact words established: *The Miller men have marked the eastern stakes. Axes by the new moon. Do not go near them, girl. I lost my Thomas to a musket and a smile.* The line about Thomas is not explained — Thistle has heard it before, many times, and the narrative treats it the way she treats it: as a wound Morrow reopens on purpose, to teach."
        - "Thistle's reply is where the steel voice first cuts through the formal cadence. One line: *If they come for the Mother, they will not leave.* The prose should register, in a single sentence of interiority, that Thistle herself is surprised by the voice that came out of her — that this register exists in her but has not been used aloud before."
        - "Morrow does not answer the steel. She holds Thistle's gaze for a long beat. Her feathers settle. She says, smaller: *Two hundred years is not long enough to be stupid, Thistle.* It is the first time the reader learns Thistle's age, dropped sideways, not announced."
      beat_function: >
        Install the external threat (Miller men), the precedent of fae loss
        to human violence (Thomas), and the first crack in Thistle's formal
        register — proof she has it in her to do what Ch. 7 will require.
      prose_directives:
        - "Morrow's half-form is described once, precisely, and not re-described."
        - "Thomas is named but not elaborated. The reader should feel the weight without being given the story."
        - "The age-reveal must be incidental — not a narrator announcement, not italicized, not paragraph-breaked. Just dropped in dialogue."
      closes_on: >
        Morrow's black eyes on Thistle's, the unsaid thing between them
        — that Thistle has already been tempted by what the Miller men are,
        by what humans are, long before any axe has fallen.

    - id: ch01_b03
      title: "The Distant Cry"
      approx_words: 250
      opens_on: >
        The silence after Morrow's warning, held one beat too long. The
        forest's ambient layer — wind through cedar, a creek two hollows
        over — and then, cutting through it, a man's voice.
      action_sequence:
        - "One shout. Male. Distant — three-quarters of a mile east, maybe more. The shout is not a call for help; it is the sound a person makes when something has just happened to their body. Pain, surprise, the breath knocked out. Then nothing. The forest resumes its ambient hum, which somehow makes the silence worse."
        - "Morrow caws — a real crow's caw, not speech — sharp, twice. A clear warning: *leave it.* Her feathered shoulders have gone rigid. She does not shift back to full crow; she is waiting to see what Thistle does."
        - "Thistle's interiority for three sentences: she knows what Morrow is telling her. She knows the law. She knows the direction the cry came from is the direction of the eastern edge, which is the direction of the Miller men, which is the direction Morrow has just forbidden. She knows she is about to disobey and she does not fully know why."
        - "She moves. Not dramatically — she simply turns east and begins walking. Bare feet on moss, unhurried, as though a decision has been made without her participation. She passes the Mother without stopping. She passes the hollow of human things without stopping. She does, in passing, reach down and brush one fingertip across the tin whistle, and leave it behind on the Mother's roots rather than in the hollow — a gesture the reader should register as *offering*, not *forgetting*."
        - "Morrow, behind her, does not call after her. Morrow is silent. The silence is worse than a shout would have been."
      beat_function: >
        The inciting incident. The pull of the human thing wins over the
        warning. Establishes the pattern the whole book will turn on:
        Thistle knows the rule, breaks it anyway, and cannot fully explain
        why to herself.
      prose_directives:
        - "The cry is one sound. Not described in detail. The less the reader gets, the more the reader leans in — matching Thistle."
        - "Her decision to go is *not* dramatized. No internal argument, no 'she had to.' She simply moves. The absence of dramatization is the drama."
        - "The tin whistle transfer from hollow to Mother's roots must be a single clean sentence. No symbolism explained. The reader will pay for it in Ch. 10."
        - "Morrow's silence at the exit is load-bearing. Do not have her speak."
      closes_on: >
        Thistle's bare feet on moss, moving east. The tin whistle on the
        Mother's roots behind her, catching the last of the golden-hour
        light. The chapter ends on the image, not on a thought.

  prohibited_at_chapter_level:
    - "Cal is never named in this chapter — he exists only as 'a man's voice.'"
    - "Full glamour throughout; no wing-reveal, no true-scale reveal."
    - "The Mother has no dialogue; she is felt, not voiced."
    - "No human POV or human-interior access; Thistle's register governs the chapter."
    - "No narrator gloss on the fae/human romance to come. The chapter does not know it is a setup."