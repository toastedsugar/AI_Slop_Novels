# ============================================================
- id: thistle
  name_display: Thistle
  name_full: Thistle-in-the-Hollow
  role: protagonist
  species: fae
  age: 200
  apparent_age: "early-twenties"
  pronouns: she/her
  occupation: "warden of the Greenwood"
 
  physical:
    description:
      - "average human-size under glamour, slight build"
      - "ash-blonde hair"
      - "green eyes — wrong shade, off enough to notice"
      - "freckles in patterns resembling birch bark"
      - "usually barefoot"
      - "too-thin simple dress, out of season"
    alternate_form:
      - "roughly six inches taller than glamour"
      - "iridescent wings unfurl from her back"
      - "eyes the green of sun through new leaves"
      - "freckles resolve into visible bark-patterning"
      - "presence reads as terrible and beautiful"
    tells:
      - "freckle patterns becoming too regular"
      - "eye color intensifying"
      - "faint shimmer at the shoulders"
      - "single iridescent scale shed"
 
  voice:
    cadence: "formal, slightly archaic, unhurried"
    register_default: "courtly / ritual"
    register_under_duress: "steel-cold, clipped, imperative"
    speech_tells:
      - "does not use contractions in formal register"
      - "wind-chime laugh, rare"
    hard_constraints:
      - "cannot lie (fae law); may delay or omit but never speak falsehood"
      - "does not use modern slang ever"
    sample_lines:
      - "I am as real as you are kind."
      - "I would grow another."
      - "Your heart is a good one. I am sorry it has carried so much."
      - "I do not wish to sleep alone."
 
  interiority:
    baseline_emotional_state: "solitary, dutiful, quietly lonely without knowing it"
    core_want: "to be known without having to explain herself"
    core_fear: "being the cause of harm to what she is sworn to protect"
    blind_spots:
      - "forgets to ask obvious questions when happy"
      - "underestimates how fast human situations move"
    compulsions:
      - "takes small human objects — buttons, bootlaces, whistles"
      - "watches humans she should not be watching"
    moral_core: "the forest is kin; kindness to the forest earns kinship"
 
  backstory:
    - "two hundred years old; has lived her whole life in service of the heart-tree"
    - "has never been loved by a human, or thought she wanted to be"
    - "raised on her aunt Morrow's grief-shaped view of humans"
 
  signature_objects:
    - "her collection in the hollow at the heart-tree's base"
    - "an iridescent scale she sheds when her glamour slips"
 
  prohibited_in_prose:
    - "self-awareness about being not like other fae"
    - "modern emotional vocabulary (processed, boundaries, trauma)"
    - "apologizing for her nature"
    - "any lie, including white lies or polite falsehoods"
 
