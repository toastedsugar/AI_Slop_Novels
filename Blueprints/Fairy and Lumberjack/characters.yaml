- id: cal
  name_display: Cal
  name_full: Caleb Thorne
  role: male_lead
  species: human
  age: 30
  apparent_age: null
  pronouns: he/him
  occupation: "tree-marker / logger for Miller Company"
 
  physical:
    description:
      - "tall, lean, worked-hard"
      - "dark hair"
      - "green-grey eyes"
      - "trimmed beard"
      - "small scar on brow"
      - "pronounced left-leg limp"
      - "calloused, careful hands"
      - "wool, flannel, practical logger kit; one good shirt"
    alternate_form: []
    tells: []
 
  voice:
    cadence: "sparse, plain, Pacific Northwest 1890s"
    register_default: "quiet, few words, careful"
    register_under_duress: "even quieter — the break is going silent, not raising volume"
    speech_tells:
      - "apologizes to trees before marking them"
      - "uses ma'am reflexively"
      - "understates physical pain"
    hard_constraints:
      - "does not give long speeches; max 2-3 sentences per turn"
      - "does not use profanity around women"
      - "does not lie to people he cares for"
    sample_lines:
      - "Sorry. Sorry. Didn't mean to crowd you."
      - "That'll take your finger off."
      - "Back by dark."
      - "I knew. I didn't want to be right."
 
  interiority:
    baseline_emotional_state: "exhausted, dutiful, quietly grieving his own life"
    core_want: "permission to stop"
    core_fear: "becoming his father; being a man who cuts down sacred things"
    blind_spots:
      - "assumes kindness from others is a trick until proven otherwise"
      - "cannot ask for help"
    compulsions:
      - "apologizes to every tree he marks"
      - "whittles when he cannot sleep"
    moral_core: "treats every living thing — tree, dog, stranger — as owed basic courtesy"
 
  backstory:
    - "father died leaving debt to Miller Company"
    - "younger brother Samuel, 16, a gifted student"
    - "three years of logging to fund Samuel's education"
    - "has never told anyone the above"
 
  signature_objects:
    - "straight razor, inherited from his father"
    - "a whittling knife"
    - "a well-worn wool hat"
 
  prohibited_in_prose:
    - "internal monologue longer than a paragraph"
    - "articulating his feelings in named emotions"
    - "modern therapy-speak"
    - "any dialogue that resolves his repression verbally rather than through action"
 
