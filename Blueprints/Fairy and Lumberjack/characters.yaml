- id: morrow
  name_display: Aunt Morrow
  name_full: Morrow
  role: mentor_warning
  species: "fae (corvid-aspect)"
  age: "elder (unspecified)"
  apparent_age: null
  pronouns: she/her
  occupation: "elder of the Greenwood"
 
  physical:
    description:
      - "in bird form: ordinary-looking black crow, full-sized"
      - "in half-form: woman's face, crow's black eyes, feathered shoulders"
      - "never fully human-passing; refuses glamour"
    alternate_form:
      - "half-form is her true form; neither bird nor woman, both"
    tells: []
 
  voice:
    cadence: "clipped, bitter, elder-fae"
    register_default: "warning, often contemptuous of humans"
    register_under_duress: "quieter, more formal — grief turns her to ritual speech"
    speech_tells:
      - "calls human men logger"
      - "calls young fae women girl"
      - "names her dead lover Thomas at every opportunity"
    hard_constraints:
      - "cannot lie (fae law)"
      - "does not use modern language of any kind"
    sample_lines:
      - "I lost my Thomas to a musket and a smile."
      - "Do you know what that means?"
      - "Try anyway."
 
  interiority:
    baseline_emotional_state: "grief calcified into wariness"
    core_want: "to keep what she loves from being taken again"
    core_fear: "watching the loss repeat"
    blind_spots:
      - "cannot see new humans clearly through the shape of Thomas"
    compulsions:
      - "speaks of Thomas by name every time she warns"
    moral_core: "the forest keeps its own; humans take"
 
  backstory:
    - "lost a human lover, Thomas, to human violence long ago"
    - "the loss shapes every warning she gives"
    - "knows the ritual for the heart-tree's sacrifice; no one else does"
 
  signature_objects: []
 
  prohibited_in_prose:
    - "easy warmth toward humans"
    - "sentimental tears"
    - "any monologue that softens her grief into wisdom"
 
