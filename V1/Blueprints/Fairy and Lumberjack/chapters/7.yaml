    the_broken_sorry_during_the_run: ch_later_the_new_apology_register

  continuity_out:
    pov_state: >
      Cal at the hidden spring, on his knees beside Thistle who is laid at
      the edge on the moss. His own shirt open over a chest where her print
      used to be. His hand on her sternum where his print used to be. His
      face wet, which he has not noticed. He has asked Morrow 'Tell me
      what to do' three times. Morrow has opened her mouth. The chapter
      ends in the half-second before her answer.
    cal_state: >
      Conscious, broken, has not eaten in eighteen hours, has slept perhaps
      two hours on his cabin floor, has punched Hiram Beck unconscious with
      his entire weight through his shoulder, has carried Thistle a mile
      and a half at fae speed with the forest pushing him forward, has lost
      the bond. Three objects remain in his coat: the iridescent scale, the
      dried trillium. The cedar sparrow has been left in the moss in the
      heart-tree clearing six feet from where he punched Hiram.
    thistle_state: >
      Unconscious at the spring edge. Hair across the moss the way it lay
      across Cal's pillow at dawn. Eyes closed. Lips not moving. Gold sap
      at the corner of her mouth, spread to her chin. The freckle-handprint
      that was on her sternum at dawn is gone — just bark-pattern freckles
      in a body. Her wings folded back inside her shoulders when she fell.
      Glamour neither up nor down; she does not have the focus for either.
    the_mother_state: >
      Standing in the heart-tree clearing, wounded — a foot of bite into
      the heartwood, the wound the width of a man's torso. Gold sap running
      from the wound into the moss. Hiram unconscious six feet from her
      base. The cedar sparrow in the moss beside him. Cal's axe beside that.
      The clearing otherwise empty.
    location_end: "The hidden spring, full morning, Cal on his knees beside Thistle and Morrow openly weeping at her other side."
    unresolved: >
      What Morrow is about to say. Whether Thistle can be brought back.
      Whether the Mother can be saved. What the bond requires now. Whether
      the marks can return to the bodies. Where the cedar sparrow ends up.
      What becomes of Hiram. Whether the sheriff in Hollow Creek will
      listen to him. Whether Samuel is safe in Portland. What Cal will do
      next if Morrow's answer is not survivable. What the forest wants now
      that the forest is pushing.

  beats:
    - id: ch07_b01
      title: "Cal Alone with the Mother"
      pov: cal
      approx_words: 140
      opens_on: >
        He arrives at the clearing forty minutes before the crew, still
        walking — running has made his ribs hurt and slowing has not helped.
        The mist is at his chest.
      action_sequence:
        - >
          The Mother is in front of him for the first time in his life. He
          has marked her on a map. He has discussed her felling under canvas
          at a foreman's table. He has not seen her. Nine feet across. Two
          hundred and fifty feet of red cedar going up into mist that hides
          her crown. A thousand years standing in this exact eight feet of
          dirt.
        - >
          He understands, in his body, what he was going to do. He
          understands it the way a man understands a cliff he has been
          driving toward in fog.
        - >
          He puts his palm flat on the bark, the way he has watched Thistle
          do, twice, through a window he was not supposed to be looking
          through. The bark is warm. The Mother knows him. Of course she
          knows him — she has been getting his apologies through her
          daughters and her granddaughters and her great-great-grandchildren-
          trees for three weeks.
        - >
          He kneels. He does the only thing he knows. He says, into the bark,
          "I'm sorry. I'm so sorry. I didn't know. I'm sorry."
        - >
          He stays there with his forehead against the trunk and his three
          objects in his coat — the scale, the sparrow, the dried trillium —
          until the lanterns come up the trail.
      beat_function: >
        The chapter opens on Cal meeting the Mother before anyone else
        arrives. The forty-minute window is the chapter's structural mercy
        — Cal gets the time alone with what he was being paid to fell. The
        physical specifications (nine feet across, two hundred fifty feet
        high, thousand years old, eight feet of dirt) are rendered as fact
        because Cal is a logger and would estimate them this way. The
        Mother-knows-him sentence is the chapter's first piece of explicit
        worldbuilding-as-character: the trees pass information through
        kinship; she has been receiving his apologies for three weeks; she
        is not a passive object. The kneeling apology — 'I'm sorry. I'm so
        sorry. I didn't know. I'm sorry.' — rhymes structurally with both
        chapter one beat two (Cal apologizing to the cedar at Miller's Cut
        before marking it) and chapter two beat two (Cal pinned under the
        widow-maker, still apologizing to the limb). The 'I didn't know'
        clause added to the familiar pattern is the chapter-six recognition
        landing in his apology vocabulary for the first time.
      prose_directives:
        - >
          'Forty minutes before the crew' is the chapter's structural fact;
          render it. The window matters because the chapter's first beat
          would not work if the crew were already there.
        - >
          'The mist is at his chest.' Render exact. The mist height
          establishes the cold and obscures the Mother's crown for the
          coming description.
        - >
          The Mother's physical specifications are rendered as a logger's
          estimate: nine feet across, two hundred fifty feet up, mist
          hiding the crown, a thousand years, eight feet of dirt. Render
          each measurement. The specificity is doing the awe.
        - >
          'A man understands a cliff he has been driving toward in fog.'
          Render verbatim. The cliff-in-fog simile is the chapter's first
          piece of figurative language and the chapter's structural image
          for Cal's six-day arc.
        - >
          The palm-on-bark gesture references chapter four's hidden spring
          and chapter five's morning kiss — Cal has watched Thistle do this
          twice through a window he was not supposed to be looking through.
          Render the gesture with the chapter's count of two prior
          observations. 'A window he was not supposed to be looking
          through' is the chapter's clearest self-naming of his prior
          watching as transgression.
        - >
          'The bark is warm. The Mother knows him.' Two short sentences.
          The chapter's first piece of supernatural fact rendered as
          observation; do not dramatize.
        - >
          'Of course she knows him — she has been getting his apologies
          through her daughters and her granddaughters and her great-great-
          grandchildren-trees for three weeks.' Render verbatim. The three-
          generation kinship is the chapter's clearest piece of
          worldbuilding-by-aside. Render the three-generation count.
        - >
          'I'm sorry. I'm so sorry. I didn't know. I'm sorry.' Render
          verbatim with the four sentences. The pattern explicitly rhymes
          with chapter one beat two and chapter two beat two; the prose
          pass should write the apology recognizably as the same
          structure with 'I didn't know' added.
        - >
          The three objects in his coat are named in this order: scale,
          sparrow, dried trillium. This matches chapter six's order. The
          chapter is consistent; render in order.
        - >
          'Until the lanterns come up the trail.' Render the closing image
          plain. The lanterns are the chapter's first signal of the crew's
          arrival; do not extend.
      closes_on: >
        Cal's forehead against the Mother's trunk. Three objects in his
        coat. The first lantern light on the mist beyond his shoulder.

    - id: ch07_b02
      title: "The Crew Arrives, The Demand"
      pov: cal
      approx_words: 110
      opens_on: >
        Twelve men. Lanterns. The two-man saw on a sledge.
      action_sequence:
        - >
          Hiram Beck in front — six-foot-three, broad as a barn door,
          sandy-blond going to grey at the temples, pale blue eyes, the
          kind of physical authority that does not ask for consent, his
          face the red of a man either drunk last night or drunk now.
        - >
          The men go quiet when they see Cal kneeling at the base of the
          tree he has been hired to fell.
        - >
          Hiram's voice. Loud, performative — for the men. "Thorne. Get up.
          We've got six weeks of work and you're praying to a tree." Cal
          does not get up. The men shift their feet.
        - >
          Hiram crosses the moss. "Pick up your axe, Thorne. I won't ask
          twice."
        - >
          Cal stands. He puts his back against the Mother. He says, quiet,
          the voice he uses to spook horses: "Hiram. The contract is
          broken. Take the men back to camp. I'll go down to the office
          today and surrender it."
      beat_function: >
        The crew arrives and the chapter's antagonist is introduced in
        physical specificity. Hiram's chapter-six 'face the red of a man
        either drunk last night or drunk now' is rendered as Cal's
        observation. The chapter-four confession reference (Hiram beating
        a younger man unconscious last spring while Cal did nothing) is
        present in the room without being named. Cal's spook-horses voice
        is introduced — quiet, calm, addressed to a dangerous animal. His
        announcement — 'The contract is broken. Take the men back to camp.
        I'll go down to the office today and surrender it.' — is Cal at
        his most decisive in the novelette so far, delivered in the
        chapter's lowest register. The structural set-up: Cal has refused
        the contract; the chapter's question becomes whether Hiram lets
        him.
      prose_directives:
        - >
          The crew is rendered as a count and three objects: twelve men,
          lanterns, the two-man saw on a sledge. The two-man saw is the
          tool that would be used after the felling cuts; its presence
          establishes that this is meant to be a full extraction.
        - >
          Hiram's description is rendered from chapter four's cast notes
          verbatim: six-foot-three, broad as a barn door, sandy-blond
          going to grey at the temples, pale blue eyes, the kind of
          physical authority that does not ask for consent. The 'face the
          red of a man either drunk last night or drunk now' is the
          chapter's only added detail to the established description;
          render it. The reader should recognize the figure.
        - >
          'The men go quiet when they see Cal kneeling at the base of the
          tree he has been hired to fell.' Render exact. The men's silence
          is the chapter's first piece of communal recognition that
          something is wrong.
        - >
          Hiram's voice is rendered as 'loud, performative — for the men.'
          Render the performative quality. He is not addressing Cal alone;
          he is addressing his audience. This is hiram_cruelty_voice
          introduced.
        - >
          'Thorne. Get up. We've got six weeks of work and you're praying
          to a tree.' Render verbatim. The mockery of 'praying to a tree'
          is the chapter's first piece of Hiram dismissing what is real.
        - >
          'Pick up your axe, Thorne. I won't ask twice.' Render verbatim.
          The 'I won't ask twice' is the chapter's first piece of explicit
          threat; the reader files it for the later 'Pick. Up. The axe.'
        - >
          Cal's spook-horses voice is introduced here: 'quiet, the voice
          he uses to spook horses.' Render the voice's register: low,
          calm, addressed to a dangerous animal. This is the inverse of
          Hiram's loud performance; Cal is bringing the room down on
          purpose.
        - >
          '"Hiram. The contract is broken. Take the men back to camp. I'll
          go down to the office today and surrender it."' Render verbatim.
          The four sentences are Cal's decision in plain order. The
          'office today' establishes Cal is willing to do the formal
          surrender; this is not a refusal in the woods, it is a
          dissolution of contract.
      closes_on: >
        Cal with his back against the Mother. Hiram three steps from him on
        the moss. Eleven men behind Hiram in the lantern light. The two-man
        saw on the sledge between them.

    - id: ch07_b03
      title: "The Cruelty: The Witch or the Boy"
      pov: cal
      approx_words: 140
      opens_on: >
        Hiram's face works. He has been waiting for this. He has been
        waiting for Cal for three years — the foreman's quiet pet who
        out-cuts him every quarter and who reads in the bunkhouse and who
        apologizes to trees.
      action_sequence:
        - >
          Hiram smiles, and the smile makes his good blue eyes uglier.
          "You've gone soft, boy, because you've been tupping a witch."
        - >
          The crew goes still. Hiram raises his voice. "Don't pretend,
          Thorne. The men saw the flowers around your cabin yesterday. Out
          of season. Five kinds, in November. We've all been waiting to
          see how long it'd take you to admit it."
        - >
          He turns to the crew and spreads his arms like a preacher.
          "There's a witch in his cabin, boys. Has been since he came off
          the widow-maker with a busted leg miraculously healed."
        - >
          He turns back to Cal. He lets his voice drop. "Miller Company
          don't pay for witchcraft. Pick up the axe, Thorne, or I'll send
          a runner to the sheriff in Hollow Creek for her. And one to
          Portland for your brother's school. Take your choice. The witch
          or the boy."
      beat_function: >
        The chapter's cruelty beat — the antagonist's full case made aloud.
        Hiram's three-year resentment is rendered as character history:
        the foreman's quiet pet who out-cuts him, reads in the bunkhouse,
        apologizes to trees. The accusation arrives in escalating
        specificity: tupping a witch → the flowers around the cabin (the
        chapter-five-and-six porch-step flora named in court) → the
        widow-maker leg (chapter two's healing named as evidence) → the
        two threats: sheriff for the witch, Portland for the brother. The
        'witch or the boy' binary is the chapter's structural false
        choice. The chapter title — 'The Axe and the Foreman' — is the
        foreman as the chapter's foil; the axe is the choice the foreman
        is forcing.
      prose_directives:
        - >
          'Hiram's face works. He has been waiting for this.' Render the
          face-works image. Hiram has been holding this confrontation
          inside himself for three years; the chapter is finally
          permitting it.
        - >
          'The foreman's quiet pet who out-cuts him every quarter and who
          reads in the bunkhouse and who apologizes to trees.' Render the
          three-fold list of Hiram's resentments verbatim. Each clause is
          a piece of Cal-character Hiram has been resenting; each is
          accurate to Cal as established.
        - >
          'Hiram smiles, and the smile makes his good blue eyes uglier.'
          Render exact. The 'good blue eyes uglier' is the chapter's
          clearest piece of physical-feature-as-moral language.
        - >
          '"You've gone soft, boy, because you've been tupping a witch."'
          Render verbatim. The vulgarity is character voice; do not
          soften it. 'Tupping' is the period diction and the cruelty.
        - >
          'The crew goes still.' Render the communal stillness. The men
          are now witnesses to an accusation; the crew is the public
          square.
        - >
          The accusation specifics — flowers around the cabin, out of
          season, five kinds in November — are rendered exactly. The
          chapter-five and chapter-six porch-step flora have been visible
          to the men; the chapter names what was always being seen by
          someone.
        - >
          'He turns to the crew and spreads his arms like a preacher.'
          Render the preacher posture. Hiram is performing an accusation
          to an audience; the religious imagery is the chapter's
          structural counterpoint to chapter five's 'the way men in his
          father's church used to look at a relic.'
        - >
          '"There's a witch in his cabin, boys. Has been since he came off
          the widow-maker with a busted leg miraculously healed."' Render
          verbatim. The widow-maker reference is chapter two's healing
          made public; what Cal has been keeping private is now in the
          mouth of the foreman in front of the crew.
        - >
          'He lets his voice drop.' The drop in voice is the cruelty's
          performance technique; the threat works because it is delivered
          quietly. Render the drop.
        - >
          '"Pick up the axe, Thorne, or I'll send a runner to the sheriff
          in Hollow Creek for her. And one to Portland for your brother's
          school. Take your choice. The witch or the boy."' Render
          verbatim. The two threats are precisely specified: sheriff /
          Hollow Creek for the witch, Portland / brother's school for
          Samuel. The 'Take your choice' and 'The witch or the boy' are
          the chapter's structural binary. The reader registers it as
          false; Cal does too.
      closes_on: >
        Hiram three steps from Cal. The crew silent behind him. The Mother
        behind Cal. The contract still in Hiram's coat. The axe on the
        moss between them.

    - id: ch07_b04
      title: "Cal's Silence, Thistle Arrives in Full Fae"
      pov: cal
      approx_words: 130
      opens_on: >
        Cal does not speak. He looks at Hiram. He does not blink.
      action_sequence:
        - >
          He has been a quiet man for thirty years and the silence in him
          goes all the way down. The men have never seen him like this.
          Two of them — younger ones, boys really — step backward.
        - >
          She steps out of the tree line on the eastern side of the
          clearing. Full fae. Glamour gone. Wings half-unfurled — iridescent
          in the mist, six inches taller than her human shape, eyes the
          green of sun through new leaves, freckles in bark-patterns down
          her sternum and her bare arms and her throat where the high
          collar of her dress has come open at the laces. Hair loose to her
          hips. Small bare feet on the moss.
        - >
          She has run from the spring at fae speed and her body is still
          failing to make a clean human shape. She is terrible in the
          cathedral way — the way that makes men understand they are small.
        - >
          Two men in the back drop their tools and run into the mist. They
          will be telling this story for the rest of their lives and no one
          in Hollow Creek will believe them.
      beat_function: >
        Cal's silence is rendered as a structural decision. Two younger
        crewmen step back; the older crew has never seen him like this.
        The beat establishes the change in him before Thistle's arrival —
        the silence is the work he is doing while he decides not to pick
        up the axe. Thistle's full-fae arrival is the chapter's visual
        climax: six inches taller, wings half-unfurled, bark-pattern
        freckles visible across every uncovered skin, the high collar
        finally open (at the laces, undone by her own glamour-failure not
        by either of them on purpose). The 'terrible in the cathedral way'
        is the chapter's clearest piece of fae-as-religious-awe writing.
        Two crewmen run; the chapter explicitly tells the reader these
        men will tell the story for the rest of their lives and no one
        will believe them — a small piece of folklore-genesis embedded
        in the beat.
      prose_directives:
        - >
          'Cal does not speak. He looks at Hiram. He does not blink.'
          Render the three sentences. The not-speaking, not-blinking, and
          looking are the structural acts of Cal's silence.
        - >
          'He has been a quiet man for thirty years and the silence in him
          goes all the way down.' Render exact. The 'goes all the way
          down' is the chapter's clearest piece of Cal-as-iceberg
          language: the visible silence is the surface of the available
          silence.
        - >
          'The men have never seen him like this.' Render plain. The
          communal observation establishes the change.
        - >
          The full-fae arrival is rendered in a single long sentence with
          stacked descriptors: wings (iridescent in the mist, half-
