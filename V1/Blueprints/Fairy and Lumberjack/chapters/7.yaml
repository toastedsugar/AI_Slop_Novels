chapter:
  id: ch07
  number: 7
  title: "The Axe and the Foreman"
  word_count_target: 1200

  narrative_function: confrontation_climax_and_the_bond_struck_from_both_bodies
  arc_position: novelette_climax_third_act_inflection_point
  story_structure_role: >
    The chapter every prior chapter has been preparing. Cal arrives at the
    heart-tree clearing forty minutes before the Miller crew and meets the
    Mother for the first time in his life; he kneels and apologizes the way
    he apologized to a cedar at Miller's Cut twenty-eight days ago, in the
    sentence pattern the novelette has been building since chapter one. The
    crew arrives. Hiram Beck demands the cut. Cal refuses. Hiram delivers
    the chapter's cruelty — 'a witch in his cabin,' the choice between the
    witch and the boy — and Cal goes silent in the way that has always
    preceded the breaking. Thistle arrives in full fae out of the eastern
    tree line. The matched marks on both sternums are gone, struck out by
    the same axe that bites the Mother. Cal's three years of held silence
    breaks in one logger's punch; Hiram falls; the crew scatters; Cal
    carries Thistle to the hidden spring at fae speed with the forest
    opening the path. The chapter ends on Cal at the spring with Morrow
    openly weeping beside him, the marks gone from both their bodies, and
    Cal asking 'Tell me what to do' three times before Morrow opens her
    mouth to answer. Chapter eight opens on her answer.

  pov:
    mode: single
    character: cal

  setting_summary:
    time_of_year: early_autumn_1897
    time_of_day: first_light_through_full_morning_of_the_eighth_day

  locations_present:
    - heart_tree_clearing           # primary setting; the Mother's clearing
    - the_mother_at_the_clearing    # the heart cedar; both location and character
    - eastern_clearing_tree_line    # where Thistle arrives from
    - forest_path                   # Cal's arrival walking; the run after
    - the_hidden_spring             # closing sequence; Thistle laid at the edge

  locations_referenced:
    - cal_cabin                     # where Cal came from at first light
    - millers_cut                   # where the crew came from
    - hollow_creek                  # where Hiram will be sent in a cell
    - portland                      # Samuel's school; the second threat
    - the_camp_office               # where Cal said he would surrender the contract

  characters_present:
