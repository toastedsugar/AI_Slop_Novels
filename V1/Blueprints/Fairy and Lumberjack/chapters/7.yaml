    - id: ch07_b09
      title: "Cal Goes to Her, Her Full Name, The Sparrow Left"
      pov: cal
      approx_words: 150
      opens_on: >
        He crosses the moss on his knees the last three yards.
      action_sequence:
        - >
          He gathers her up. She weighs nothing — she has always weighed
          nothing — but the less she weighs now is something he can feel
          in his arms, the absence of a breath under skin, the wrongness
          of a body whose animating thing has gone somewhere else.
        - >
          He presses his forehead to her temple. He says her full name
          three times into her hair, the only way he knows how to call her
          back: "Thistle-in-the-Hollow. Thistle-in-the-Hollow. Thistle-in-
          the-Hollow."
        - >
          The same name she said into his mouth at dawn. He says it the
          way he heard her say his — formal, full, an invocation.
        - >
          Her eyes do not open. Her lips do not move. The gold at the
          corner of her mouth has spread to her chin. He puts his thumb
          to it. It is warm. It is sap. It is her blood. He stops being
          able to think.
        - >
          The print of his hand on her sternum that he traced with his
          thumb at dawn — gone. Just freckles in bark-patterns. Just a
          body. He understands, in his arms, that the mark going into her
          means the bond is gone or going and he does not know the
          difference and he does not know how to bring it back.
        - >
          The cedar sparrow has fallen out of his coat in the punch. It is
          in the moss six feet from his knees. He cannot stop for it. He
          cannot leave her for the three seconds it would cost. He looks
          at it. He leaves it.
      beat_function: >
        The chapter's longest beat and the structural inversion of
        chapter five's consummation. Where chapter five was Cal above her
        attending to her body in full sensation, this is Cal gathering
        her up with the animating thing gone. The full-name-three-times
        invocation is the chapter's clearest piece of trying to call her
        back — the same name she gave him in chapter five beat seven,
        delivered now in the inverse register (he is trying to bring her
        back rather than to dissolve into her). The chapter explicitly
        names the rhyme: 'the way he heard her say his — formal, full, an
        invocation.' The chapter's three repetitions of her full name
        rhyme with the chapter's three repetitions of 'Tell me what to
        do' at the close. The cedar sparrow being left is the chapter's
        most heartbreaking structural choice: Cal cannot afford the three
        seconds to retrieve the gift he made her over the three nights
        she could not find the words. The sparrow stays in the moss; the
        chapter title becomes one of its objects.
      prose_directives:
        - >
          'He crosses the moss on his knees the last three yards.' Render
          the specific posture: on his knees, the last three yards. He
          does not stand to cross; he stays low.
        - >
          'She weighs nothing — she has always weighed nothing — but the
          less she weighs now is something he can feel in his arms.'
          Render the parenthetical exact. The 'less she weighs now' is
          the chapter's clearest piece of body-as-departure language.
        - >
          'The absence of a breath under skin, the wrongness of a body
          whose animating thing has gone somewhere else.' Render both
          clauses. The 'animating thing has gone somewhere else' is the
          chapter's structural fae-physiology claim: the body is housing,
          not source.
        - >
          'Thistle-in-the-Hollow. Thistle-in-the-Hollow. Thistle-in-the-
          Hollow.' Render verbatim with the three full repetitions. The
          three iterations of the full name are the chapter's first
          triplet of three; the second will be the 'Tell me what to do'
          at the close. Render the rhyme.
        - >
          'The same name she said into his mouth at dawn. He says it the
          way he heard her say his — formal, full, an invocation.' Render
          exact. The chapter explicitly names the chapter-five rhyme.
          'Invocation' is the operative noun.
        - >
          'Her eyes do not open. Her lips do not move.' Render the two
          short sentences. The non-response is the heart of the beat.
        - >
          'The gold at the corner of her mouth has spread to her chin. He
          puts his thumb to it. It is warm. It is sap. It is her blood.'
          Render the three-clause identification: warm, sap, her blood.
          The chapter is naming what the gold is in three steps.
        - >
          'He stops being able to think.' Render plain. The cognitive
          collapse is the beat's emotional center.
        - >
          The missing print discovery is rendered: 'gone. Just freckles
          in bark-patterns. Just a body.' Render the three short clauses.
          The 'Just a body.' is the chapter's bleakest reduction.
        - >
          'The mark going into her means the bond is gone or going and he
          does not know the difference and he does not know how to bring
          it back.' Render exact. The 'gone or going' and the two
          don't-knows are the chapter's clearest piece of helpless-
          recognition language.
        - >
          The cedar sparrow sequence is rendered in four short sentences:
          'It is in the moss six feet from his knees. He cannot stop for
          it. He cannot leave her for the three seconds it would cost. He
          looks at it. He leaves it.' Five sentences actually — render
          each. The three-second specificity is the chapter's most
          devastating piece of cost-accounting: three seconds is what the
          gift is worth in this moment compared to her, and three seconds
          is too much.
      closes_on: >
        Cal on his knees with Thistle in his arms. The cedar sparrow in
        the moss six feet behind him. Bract howling still. Morrow
        somewhere overhead.

    - id: ch07_b10
      title: "Morrow, The Run, The Spring, Both Marks Gone, Tell Me What To Do"
      pov: cal
      approx_words: 180
      opens_on: >
        Morrow lands on his shoulder in crow form. She does not shift. She
        does not have time. She caws once in his ear — go. He goes.
      action_sequence:
        - >
          Cal carrying Thistle. Bract at his heels. Morrow above. The
          forest opens the path the way it opened a path for him this
          morning, the second mercy in twelve hours, except that this one
          feels like a hand pushing him forward more than a kindness.
        - >
          He whispers apologies into her hair the whole way — not the
          careful sorry he has given to trees, the broken sorry of a man
          who finally understands what he is.
        - >
          He lays her at the edge of the spring on the moss. Her hair
          across the moss the way it lay across his pillow at dawn. Her
          eyes closed. The gold sap at her mouth still.
        - >
          He puts his hand on her sternum and finds the print not there
          and makes a sound that the spring will remember for two hundred
          years.
        - >
          Then he does the thing he has been not doing since the woods.
          He pulls open the front of his own shirt. He looks. The bruise-
          mark on his own chest, the print of her hand that has been
          there since the night she healed him — gone. Just skin. The bond
          is dying in both bodies and it is dying together.
        - >
          Bract lies down at her feet and presses his head to her ankle
          and does not move. Morrow drops out of the air, shifts to half-
          form at last, lands on her knees beside her niece. She is openly
          weeping, which Thistle has never seen her do, which Cal has only
          seen one other woman do in his life — Mae Pritchard at her
          father's funeral, when he was sixteen. Morrow does not speak.
          She cannot speak yet.
        - >
          Cal on his knees. His hand on Thistle's sternum where his print
          used to be. His own shirt open over a chest where her print used
          to be. Morrow at her other side. Bract at her feet. The Mother
          somewhere behind them in the clearing with her wound open and
          her gold running into the moss.
        - >
          Cal looks up at Morrow, his face wet — he has not noticed his
          own face — and he says, "Tell me what to do." Morrow does not
          answer. He says it again. "Tell me what to do." He says it a
          third time. "Tell me what to do." Morrow opens her mouth.
      beat_function: >
        The chapter's longest beat and its structural close. Morrow's
        single caw in his ear ('go') is her only voice in the chapter;
        the chapter is deliberately silent on her speaking until the
        cliffhanger. The forest opening the path 'the second mercy in
        twelve hours, except that this one feels like a hand pushing him
        forward more than a kindness' is the chapter's structural escalation
        of forest-as-actor: it is no longer passive, no longer kind, it
        is intervening. Cal's broken-sorry apology during the run is
        named explicitly as different from the careful sorry he gave
        trees — 'the broken sorry of a man who finally understands what
        he is.' This is the chapter's clearest piece of Cal-as-changed.
        The spring scene rhymes with chapter four (Cal at the spring with
        Thistle for the first time) by inversion: now she is unconscious
        at the edge, her hair across the moss the way it lay across his
        pillow at dawn. The sound that the spring will remember for two
        hundred years is the chapter's planted worldbuilding-as-landscape-
        memory. Cal pulling open his own shirt is the chapter-three plant
        finally resolved — the mirror he stopped looking in for seven
        days has now become his own bare chest under his own eyes. Both
        marks gone, both bodies losing the bond at the same rate. The Mae
        Pritchard reference grounds Morrow's weeping in Cal's specific
