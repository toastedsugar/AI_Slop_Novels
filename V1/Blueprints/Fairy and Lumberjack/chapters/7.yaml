    - id: ch07_b06
      title: "Hiram Picks Up the Axe, The Strike"
      pov: cal
      approx_words: 140
      opens_on: >
        Hiram picks up the axe. Cal's axe.
      action_sequence:
        - >
          The one Cal taught Thistle to hold on Day 3, hands over hands,
          his chest against her back, his thumb on her wrist. That axe.
        - >
          Hiram lifts it off the moss with the practiced ease of a man who
          has felled three thousand trees in his life. Cal sees him do it.
          Cal moves toward him — three strides — but Hiram has already
          turned to the Mother and is already swinging and the swing is
          the swing of a thirty-year veteran and there is no time, no
          time —
        - >
          The axe bites the Mother. Deep — a full foot of bite, into the
          heartwood, the wound the width of a man's torso.
        - >
          The sound is not a sound. It is what a green thing makes when it
          understands it is being killed: a low rending creak in the air
          and a higher pure note under it that does not travel through the
          ear but lands in the chest, behind the sternum, in the place a
          man keeps the names of the dead.
        - >
          Every man in the clearing feels it. Bract howls and does not
          stop howling.
      beat_function: >
        The chapter's structural strike. Hiram picks up Cal's axe — the
        chapter-four hand-over-hand axe — and the recognition is named
        explicitly: 'That axe.' The continuity makes the strike personal
        in a way the prose pass must preserve. Hiram's practiced ease as
        a thirty-year veteran is the chapter's clearest piece of
        antagonist-as-competent-craftsman language; he is not bad at his
        job. The 'no time, no time —' double is Cal's interior under
        compression; render the repetition. The strike itself is rendered
        with physical specifications (a foot of bite, into the heartwood,
        the wound width of a man's torso) and then the chapter's most
        important sentence: 'The sound is not a sound. It is what a green
        thing makes when it understands it is being killed.' The two-part
        sound — low rending creak in the air, higher pure note under it —
        is rendered with the second one landing in the chest 'in the place
        a man keeps the names of the dead.' This is the chapter's most
        loaded interior image. Bract's howl is introduced — the dog's
        voice in this chapter is howl, not bark.
      prose_directives:
        - >
          'Hiram picks up the axe. Cal's axe.' Render the two short
          sentences. The second sentence's possessive is the beat's
          structural specificity.
        - >
          'The one Cal taught Thistle to hold on Day 3, hands over hands,
          his chest against her back, his thumb on her wrist. That axe.'
          Render verbatim with the four chapter-four references in one
          sentence. The 'That axe.' is the recognition; render the period.
        - >
          'A man who has felled three thousand trees in his life.' Render
          the count. Hiram's expertise is a specific number; do not
          gloss.
        - >
          'No time, no time —' Render the double with the em-dash. Cal's
          interior under compression.
        - >
          The strike's physical specifications are rendered with three
          measurements: deep — a full foot of bite, into the heartwood,
          the wound width of a man's torso. Each measurement is one
          clause. Render each.
        - >
          'The sound is not a sound. It is what a green thing makes when
          it understands it is being killed.' Render verbatim. The two
          sentences are the chapter's structural premise about the
          Mother as a green thing that understands.
        - >
          The two-part sound is rendered exactly: 'a low rending creak in
          the air and a higher pure note under it that does not travel
          through the ear but lands in the chest, behind the sternum, in
          the place a man keeps the names of the dead.' Render the two
          parts and the not-through-the-ear specification. 'The place a
          man keeps the names of the dead' is the chapter's clearest
          piece of grief-anatomy; render exact.
        - >
          'Every man in the clearing feels it.' Render plain. The
          communal physical experience is the chapter's structural
          fact: this is not Cal's experience alone.
        - >
          'Bract howls and does not stop howling.' Render the howl as
          the dog's first non-bark vocalization in the novelette. The
          'does not stop' establishes the howl as continuous through the
          beats that follow.
      closes_on: >
        The axe in the wound. Gold sap beginning to run from the strike.
        Hiram with the axe-haft in his hands, balanced for the second
        swing. Cal three strides from Hiram and still moving. Bract
        howling somewhere in the mist behind them.

    - id: ch07_b07
      title: "Thistle Falls, The Same Gold"
      pov: cal
      approx_words: 100
      opens_on: >
        Thistle falls. Not over — down.
      action_sequence:
        - >
          Her wings dim mid-air and fold in on themselves like something
          put away. She lands in the moss face-first and does not move.
        - >
          The freckle-patterns on her bare arms fade and re-form wrong,
          disordered, broken birch-bark into nothing. Gold sap runs from
          the corner of her mouth onto the moss.
        - >
          The same gold the Mother is running from her wound. The same
          gold.
        - >
          The body of the tree and the body of the woman are bleeding the
          same thing.
      beat_function: >
        The chapter's emotional climax. Thistle does not fall over — she
        falls down. The 'down' rather than 'over' is the chapter's
        clearest piece of physical-as-spiritual-collapse: she does not
