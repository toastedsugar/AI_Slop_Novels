    - id: ch07_b05
      title: "The Missing Mark, The Standoff"
      pov: cal
      approx_words: 110
      opens_on: >
        The print on her sternum that was the bruise-shape of his hand at
        dawn this morning is gone. Just freckles in bark-patterns. The
        matched mark is no longer on her body.
      action_sequence:
        - >
          He sees it. He understands it. He has not had time to understand
          it — his head fills with white static — and then she is across
          the clearing, and there is no time.
        - >
          Cal: "Thistle. Go home. Go home, Thistle, go home." He is trying
          to save her from what is about to happen. He uses the voice he
          uses to boys and to soldiers. He does not use the voice he uses
          to her.
        - >
          Thistle, formal: "Caleb Thorne. The Mother is my home."
        - >
          Hiram, smiling: "There she is. Look at her, boys. Wings and all.
          Now tell me again, Thorne, that I'm not earning my keep." He
          spits into the moss. He says, soft, "Last time, Thorne. Pick. Up.
          The axe."
        - >
          Cal does not pick up the axe. He turns his body fully toward
          Thistle, his back to Hiram, his back to the Mother. He has
          decided. He says, looking only at her, "Thistle. Behind me. Get
          behind me." She does not move. She has been alive for two
          hundred years. She does not get behind humans.
      beat_function: >
        The chapter's structural pivot. Cal sees the print gone — the
        matched mark from chapter five is no longer on her body. He has
        not had time to understand the absence and the chapter explicitly
        names this ('he has not had time to understand it'); the
        recognition is forced through him by the rate of events. The
        three-voice standoff is the chapter's most polyphonic exchange
        and the second instance of three-voice cross-talk in the
        novelette (after chapter six's contract confrontation). Cal uses
        the boys-and-soldiers voice — quiet, command, not the voice he
        uses to her. Thistle's 'Caleb Thorne. The Mother is my home.' is
        the chapter's clearest piece of thistle_terrible_cathedral_voice:
        formal address as defiance. Hiram's 'Pick. Up. The axe.' with the
        full stops between words is the chapter's most explicit threat-
        cadence. Cal's choice — turning his body fully toward Thistle,
        back to Hiram and the Mother — is the chapter's structural
        decision: he is willing to die for her. Her refusal to get behind
        him — 'She has been alive for two hundred years. She does not get
        behind humans.' — is the chapter's clearest piece of fae-as-
        equal: he cannot save her by standing in front of her.
      prose_directives:
        - >
          The missing print is the beat's opening fact. Render: 'is gone.
          Just freckles in bark-patterns. The matched mark is no longer on
          her body.' Render the absence in three short clauses. The 'just
          freckles' is doing the bareness.
        - >
          'He sees it. He understands it.' Render exact. The seeing and
          the understanding are simultaneous and named separately.
        - >
          'His head fills with white static.' Render the static as
          physical sensation. Cal's mind has hit its limit; the
          recognition is too much.
        - >
          The three-voice cross-talk is rendered with explicit speaker
          tags ('Cal:', 'Thistle, formal:', 'Hiram, smiling:'). The format
          mirrors chapter six's contract confrontation. Render the tags.
        - >
          '"Thistle. Go home. Go home, Thistle, go home."' Render
          verbatim with the three repetitions. The 'go home' triple is
          Cal's first triplet of the chapter; the chapter has triplets
          built into it.
        - >
          'He uses the voice he uses to boys and to soldiers. He does not
          use the voice he uses to her.' Render exact. The distinction
          between Cal's voices is the beat's structural fact.
        - >
          '"Caleb Thorne. The Mother is my home."' Render verbatim.
          Thistle's line is the chapter's clearest piece of fae-as-
          guardian assertion. Her formal use of his full name in front of
          the crew is the inverse of her using it in chapter five in the
          consummation; now it is public, now it is defiance.
        - >
          Hiram's '"Pick. Up. The axe."' Render verbatim with the full
          stops between each word. The cadence is the menace.
        - >
          'He turns his body fully toward Thistle, his back to Hiram, his
          back to the Mother. He has decided.' Render exact. The
          decision-naming is the chapter's structural pivot.
        - >
          '"Thistle. Behind me. Get behind me."' Render verbatim. Three
