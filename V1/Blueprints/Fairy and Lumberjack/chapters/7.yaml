    - the_mother                    # the heart cedar; she knows him
    - hiram_beck                    # antagonist; full chapter
    - thistle                       # arrives in full fae; falls
    - morrow                        # crow first, half-form at the spring; openly weeping
    - bract                         # at heel; howls; lies at her feet at the spring
    - twelve_miller_crewmen         # arrive together; two run early; nine scatter at the end; one is Hiram
