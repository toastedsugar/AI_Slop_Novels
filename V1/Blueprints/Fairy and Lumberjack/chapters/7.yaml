    - id: ch07_b08
      title: "The Silence Breaks, The Punch, The Crew Scatters"
      pov: cal
      approx_words: 130
      opens_on: >
        Cal's silence breaks. He has not spoken in two minutes. The sound
        that leaves him is not his voice.
      action_sequence:
        - >
          It is the voice of a man who has not allowed himself to be angry
          in three years and who is angry now.
        - >
          He crosses the moss faster than he has ever crossed any moss in
          his life. Hiram is still raising the axe for the second stroke.
          He does not get the second stroke.
        - >
          One punch — a logger's punch, three years of swung axes, his
          entire weight through his shoulder — square in Hiram's temple.
          Hiram drops. The axe falls beside him. He does not move.
        - >
          He is not dead. He will be in a cell in Hollow Creek before
          noon and he will not stop talking about witches, and no one in
          the territory will believe him, because his face will look
          exactly like what it is: the face of a man who got hit by Caleb
          Thorne.
        - >
          The crew scatters. Nine men in nine directions through the mist.
          Some of them will tell the story badly. Some of them will keep
          their mouths shut. None of them will come back to this clearing
          for the rest of their lives.
      beat_function: >
        The chapter's action climax and cal_anger_voice introduction. The
        sound that leaves Cal is named as 'not his voice' — three years
        of held-back arriving in one sound. The punch is described with
        Cal's craftsman vocabulary: a logger's punch, three years of
        swung axes, his entire weight through his shoulder. Hiram drops
        in one stroke. The chapter's forward-narration of Hiram's fate
        (cell in Hollow Creek, talking about witches, no one believing
        him, his face the consequence) is the second piece of forward-
        looking narration in the chapter (after the chapter-folklore
        aside in beat 4). 'The face of a man who got hit by Caleb Thorne'
        is the chapter's clearest piece of name-as-fact: Caleb Thorne is
        now a man with a specific reputation. The nine men scattering in
        nine directions and the chapter's note that none will come back
        to this clearing is the chapter's clean structural wipe of the
        antagonist's support.
      prose_directives:
        - >
          'Cal's silence breaks. He has not spoken in two minutes. The
          sound that leaves him is not his voice.' Render the three
          short sentences. 'The sound that leaves him is not his voice'
          is cal_anger_voice's introduction; render exact.
        - >
          'The voice of a man who has not allowed himself to be angry in
          three years and who is angry now.' Render verbatim. The
          three-year count is chapter-four's confession-context made
          structurally present in the punch.
        - >
          'He crosses the moss faster than he has ever crossed any moss
          in his life.' Render the specific superlative. Cal is moving
          at a speed he himself recognizes as unprecedented.
        - >
          'One punch — a logger's punch, three years of swung axes, his
          entire weight through his shoulder — square in Hiram's temple.'
          Render verbatim with the em-dashes. The four-fold parenthetical
          (one punch / a logger's punch / three years of swung axes / his
          entire weight through his shoulder) is the chapter's most
          compressed piece of craft-as-violence.
        - >
          'Hiram drops. The axe falls beside him. He does not move.'
          Render the three short sentences. The cadence is the immediacy.
        - >
          The forward-narration of Hiram's fate is rendered as one long
          sentence: 'He will be in a cell in Hollow Creek before noon
          and he will not stop talking about witches, and no one in the
          territory will believe him, because his face will look exactly
          like what it is: the face of a man who got hit by Caleb
          Thorne.' Render verbatim. The 'face of a man who got hit by
          Caleb Thorne' is the chapter's clearest piece of Cal-as-named-
          force.
        - >
          'Nine men in nine directions through the mist.' Render the
          symmetry. Twelve crewmen minus Hiram minus two earlier
          runaways equals nine; render the count.
        - >
          The three-fold prediction — 'Some of them will tell the story
