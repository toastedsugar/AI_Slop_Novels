# ============================================================
- id: thistle
  name_display: Thistle
  name_full: Thistle-in-the-Hollow
  role: protagonist
  species: fae
  age: 200
  apparent_age: "early-twenties"
  gender: female
  occupation: "warden of the Greenwood"

  physical:
    description:
      - "five-foot-two under glamour, long-limbed-and-lean fae slim"
      - "ash-blonde hair to her hips, slightly waved, almost too fine to be human"
      - "eyes the green of sun through new leaves"
      - "freckles in bark-patterns down her sternum, ribs, insides of her thighs, underside of her arms, tops of her feet — patterns shift when she is affected, settle into a fixed shape after Ch. 9"
      - "mouth full at the lower lip, often slightly parted; has not learned to hide her face"
      - "long throat, sharp collarbones"
      - "small high breasts the shape his hand cups perfectly when he learns where to put his hand"
      - "narrow waist; hipbones visible at the curve where the bark-pattern freckles run"
      - "long lean legs — the long line of a creature who walks twenty miles a day on moss"
      - "small bare feet with bark-pattern freckles across the tops; toes slender, arches high"
      - "does not own shoes; does not understand why anyone would"
      - "every time she is described, her feet should be described in excruciating detail"
      - "skin has the cool fae-warmth that has never been weathered"
    alternate_form:
      - "wings glamoured away most of the book — iridescent in a way that does not stay one color when light moves on them; closest comparison is a damselfly's underwing in sun"
      - "when undone, gold runs in faint threads through the iris"
      - "freckles resolve into visible bark-patterning"
      - "presence reads as terrible and beautiful"
    tells:
      - "freckle patterns becoming too regular"
      - "eye color intensifying; gold threads visible in iris"
      - "faint shimmer at the shoulders"
      - "single iridescent scale shed"
      - "clenches her feet"

  voice:
    cadence: "formal, slightly archaic, unhurried"
    register_default: "courtly / ritual"
    register_under_duress: "steel-cold, clipped, imperative"
    speech_tells:
      - "does not use contractions in formal register"
      - "wind-chime laugh, rare"
    hard_constraints:
      - "cannot lie (fae law); may delay or omit but never speak falsehood"
      - "does not use modern slang ever"
    sample_lines:
      - "I am as real as you are kind."
      - "I would grow another."
      - "Your heart is a good one. I am sorry it has carried so much."
      - "I do not wish to sleep alone."

  interiority:
    baseline_emotional_state: "solitary, dutiful, quietly lonely without knowing it"
    core_want: "to be known without having to explain herself"
    core_fear: "being the cause of harm to what she is sworn to protect"
    blind_spots:
      - "forgets to ask obvious questions when happy"
      - "underestimates how fast human situations move"
    compulsions:
      - "takes small human objects — buttons, bootlaces, whistles"
      - "watches humans she should not be watching"
    moral_core: "the forest is kin; kindness to the forest earns kinship"

  backstory:
    - "two hundred years old; has lived her whole life in service of the heart-tree"
    - "has never been loved by a human, or thought she wanted to be"
    - "raised on her aunt Morrow's grief-shaped view of humans"
    - "refuses to wear footwear"

  signature_objects:
    - "her collection in the hollow at the heart-tree's base"
    - "an iridescent scale she sheds when her glamour slips"

  prohibited_in_prose:
    - "self-awareness about being not like other fae"
    - "modern emotional vocabulary (processed, boundaries, trauma)"
    - "apologizing for her nature"
    - "any lie, including white lies or polite falsehoods"

# ============================================================
- id: cal
  name_display: Cal
  name_full: Caleb Daniel Thorne
  role: male_lead
  species: human
  age: 30
  apparent_age: null
  gender: male
  occupation: "tree-marker / logger for Miller Company"

  physical:
    description:
      - "six-foot-two, the working build of a logger who has been swinging an axe since he was twelve"
      - "broad through the shoulders; the kind of waist a working man keeps without trying"
      - "forearms corded and vein-mapped from the haft of an axe"
      - "dark hair, slightly too long, falls forward when he bends"
      - "dark beard kept just short of unkempt"
      - "eyes green-grey — closer to green in good light, closer to grey in foul"
      - "hands large enough to span Thistle's wrist with the thumb covering her pulse; calluses at the heel of each palm"
      - "dark hair across his chest, dense at the sternum, tapering down"
      - "long pale scar at his ribs from where Samuel saved him from a falling cedar when Cal was sixteen"
      - "small scar along his eyebrow from a chain that broke when he was twenty-two"
      - "wool, flannel, practical logger kit; one good shirt"
    alternate_form: []
    tells:
      - "after Ch. 8 rite: thin gold seam under the skin from the heel of his left thumb up the inside of his wrist along the vein — visible always, fading to silver in certain slants of light by Ch. 10"
      - "after the night of the woods: bruise-shape on his sternum, the print of her splayed hand — faded in Ch. 10 to a pale gold-tinted shadow visible only in low light"

  voice:
    cadence: "sparse, plain, Pacific Northwest 1890s"
    register_default: "quiet, few words, careful"
    register_under_duress: "even quieter — the break is going silent, not raising volume"
    speech_tells:
      - "apologizes to trees before marking them"
      - "uses ma'am reflexively"
      - "understates physical pain"
    hard_constraints:
      - "does not give long speeches; max 2-3 sentences per turn"
      - "does not use profanity around women"
      - "does not lie to people he cares for"
    sample_lines:
      - "Sorry. Sorry. Didn't mean to crowd you."
      - "That'll take your finger off."
      - "Back by dark."
      - "I knew. I didn't want to be right."

  interiority:
    baseline_emotional_state: "exhausted, dutiful, quietly grieving his own life"
    core_want: "permission to stop"
    core_fear: "becoming his father; being a man who cuts down sacred things"
    blind_spots:
      - "assumes kindness from others is a trick until proven otherwise"
      - "cannot ask for help"
    compulsions:
      - "apologizes to every tree he marks"
      - "whittles when he cannot sleep"
      - "stares at bare feet and small breasts"
      - "aroused by powerful women"
      - "dreams of being stepped on by a small barefoot woman"
    moral_core: "treats every living thing — tree, dog, stranger — as owed basic courtesy"

  backstory:
    - "father died leaving debt to Miller Company; mother died of grief the spring after"
    - "younger brother Samuel, 23, schoolteacher in Portland — a gifted student Cal funded"
    - "three years of logging to fund Samuel's education"
    - "the long pale scar on his ribs is from Samuel saving him from a falling cedar at sixteen"
    - "has never told anyone the above"

  signature_objects:
    - "straight razor, inherited from his father"
    - "a whittling knife"
    - "a well-worn wool hat"

  prohibited_in_prose:
    - "internal monologue longer than a paragraph"
    - "articulating his feelings in named emotions"
    - "modern therapy-speak"
    - "any dialogue that resolves his repression verbally rather than through action"

