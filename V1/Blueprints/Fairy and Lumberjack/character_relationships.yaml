# ============================================================
# CHARACTER RELATIONSHIPS
# ============================================================

- pair: [thistle, cal]
  type: romantic_lead
  status: nascent
  dynamic: >
    She heals him against every law she knows. He does not ask what she is.
    He falls first, quietly, by accident. She falls harder and later, and
    does not have a word for it. Trust is built in silences and small objects.
  tension:
    - "she cannot tell him the heart-tree is what his company wants to fell"
    - "he suspects she is not human; he does not ask because asking would
       end something he is not ready to lose"
  prohibited:
    - "instant attraction stated as such"
    - "banter as primary connection mode"
    - "resolved by talking about feelings"

- pair: [thistle, morrow]
  type: family_mentor
  status: strained
  dynamic: >
    Morrow raised Thistle on grief. She loves her as elders love what they
    cannot keep safe. Every warning she gives Thistle is a warning she could
    not give herself in time.
  tension:
    - "Thistle is doing exactly what Morrow did, and Morrow knows how it ends"
    - "Thistle does not believe Morrow's story applies to Cal"
  prohibited:
    - "Morrow becoming soft"
    - "the argument being resolved cleanly"

- pair: [cal, samuel]
  type: siblings
  status: loving, off_page
  dynamic: >
    Cal has given three years of his body for Samuel's future. Samuel knows
    it and cannot pay it back fast enough. Their only contact is letters.
    The love is not in question. The cost is.
  tension:
    - "Samuel is almost done; the money is almost there; Cal almost made it"
    - "Cal has not told Samuel how bad it has gotten"
  prohibited:
    - "any resentment from Samuel toward Cal"
    - "Samuel appearing on page except in letters"

- pair: [cal, hiram]
  type: antagonist_subordinate
  status: hostile
  dynamic: >
    Hiram has marked Cal as soft for three years. Cal keeps his head down.
    The contract to fell the heart-tree is the moment Hiram has been waiting
    for — he knows Cal will flinch, and he is right, and he intends to
    make an example of it.
  prohibited:
    - "Hiram getting a sympathetic read"
    - "Cal confronting Hiram until the climax forces it"

- pair: [thistle, the_mother]
  type: sacred_ward
  status: lifelong
  dynamic: >
    Thistle is the Mother's warden. The Mother is the anchor of everything
    Thistle is sworn to protect. She does not speak. She does not need to.
    What Thistle feels near her is not love exactly — it is the closest thing
    a warden has to home.
  prohibited:
    - "the Mother being rendered as metaphor"
    - "the relationship being explained in dialogue"

- pair: [morrow, the_mother]
  type: ancient_knowledge
  status: custodial
  dynamic: >
    Morrow alone knows the full ritual of the named sacrifice. She has held
    this knowledge for longer than Thistle has been alive. She has never
    expected to need it.
  prohibited:
    - "this being discussed openly until the climax demands it"
