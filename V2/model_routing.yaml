# Sonnet 4.5 so far has had the best output for prose and story structure.
# Gpt5.5 with reasoning has been awful literally the worst. 
# Qwen is the most favorable for NSFW generation, but the prose leaves much to be desired.
# Llama4 is permissive and cheap but not very good. Best suited for dev purposes
# Deepseek is the least permissive of the bunch so its useless for anything.

models:
  # Anthropic models
  claude-opus:
    provider: anthropic
    model: claude-opus-4-8
    max_tokens: 8192
    temperature: [0.8, 1.0]
    input_price_per_1m: 5.00
    output_price_per_1m: 25.00
    reasoning:
      enabled: false
      budget_tokens: 2000

  claude-sonnet:
    provider: anthropic
    model: claude-sonnet-4-5
    max_tokens: 16000
    temperature: [0.8, 1.0]
    input_price_per_1m: 3.00
    output_price_per_1m: 15.00
    reasoning:
      enabled: false
      budget_tokens: 2000

  claude-haiku:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    max_tokens: 8192
    temperature: [0.8, 1.0]
    input_price_per_1m: 1.00
    output_price_per_1m: 5.00
    reasoning:
      enabled: false
      budget_tokens: 2000

  # OpenAI models
  gpt-5.5:
    provider: openai
    model: gpt-5
    text:
      verbosity: medium
    input_price_per_1m: 15.00
    output_price_per_1m: 60.00
    reasoning:
      enabled: false
      effort: low

  gpt-5.4:
    provider: openai
    model: gpt-5
    text:
      verbosity: high
    input_price_per_1m: 15.00
    output_price_per_1m: 60.00
    reasoning:
      enabled: false
      effort: minimal

  gpt-5-mini:
    provider: openai
    model: gpt-5-mini
    text:
      verbosity: medium
    input_price_per_1m: 0.40
    output_price_per_1m: 1.60
    reasoning:
      enabled: false
      effort: low

  # OpenRouter models — uses OPENROUTER_API_KEY
  # Qwen models here
  qwen-3-5-9b:
    provider: openrouter
    model: qwen/qwen3.5-9b
    max_tokens: 16000
